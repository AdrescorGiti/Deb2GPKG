[package]
name = "deb2gpkg"
version = "2.0.0"
edition = "2021"
description = "Universal converter from .deb/.rpm/.pkg.tar.zst/.AppImage to native G OS .gpkg format"
license = "MIT"

[dependencies]
anyhow = "1.0"
ar = "0.9"
tar = "0.4"
flate2 = "1.1"
xz2 = "0.1"
zstd = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.13"
walkdir = "2.5"
filetime = "0.2"
slint = "1.17"
tokio = { version = "1.53", features = ["full"] }
rfd = "0.14"

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
